name: Bake Debate Audio

on:
  push:
    branches: [main]
    paths:
      - "debates/*.json"
      - "bake-debate.py"
      - "voices.json"
  workflow_dispatch:
    inputs:
      slug:
        description: "Debate slug (blank = every debate missing audio)"
        required: false
        default: ""

# Needed so the bot can push the baked audio back.
permissions:
  contents: write

concurrency:
  group: bake-debates
  cancel-in-progress: false

jobs:
  bake:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip bake]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests beautifulsoup4 boto3
      - name: Bake debates that are missing audio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          # MP3s go to R2, not the repo. Without these the bake silently writes
          # audio/ files that nothing commits — and re-synthesises them, at
          # Azure's per-character rate, on every single run.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PREFIX: thinker-arena
          ONLY_SLUG: ${{ inputs.slug }}
        run: |
          # Rather than diffing commits (fragile — a stale base can miss the new
          # debate), ask the baker itself which debates lack audio and bake only
          # those. Idempotent: existing mp3s are skipped by hash.
          python3 - <<'PY'
          import json, glob, os, subprocess, hashlib
          src = open("bake-debate.py").read().split("slug = sys.argv[1]")[0]
          src = src.replace('KEY = os.environ["AZURE_SPEECH_KEY"]; REGION = os.environ["AZURE_SPEECH_REGION"]', 'KEY=REGION="x"')
          # bake-debate.py resolves REPO from __file__; exec() has none by
          # default, so hand it one pointing at the checked-out script.
          g = {"__file__": os.path.abspath("bake-debate.py")}; exec(src, g)
          assign = g["assign_debate_voices"]; strip = g["strip_md"]
          def h(c, t):
              s = c["voice"]+"|"+(c.get("pitch") or "")+"|"+(c.get("rate") or "")+"|"+t
              return hashlib.sha1(s.encode()).hexdigest()[:16]
          only = os.environ.get("ONLY_SLUG", "").strip()
          todo = []
          for f in sorted(glob.glob("debates/*.json")):
              slug = os.path.basename(f)[:-5]
              if slug == "index": continue
              if only and slug != only: continue
              d = json.load(open(f)); ps = list(dict.fromkeys(p["thinker"] for p in d["posts"]))
              dv = assign(ps); dd = f"audio/debate/{slug}"
              # Ask the manifest, not the filesystem. The MP3s live in R2 now,
              # so a checkout has none of them — testing os.path.exists would
              # mark every debate as missing and re-synthesise the whole
              # archive, at Azure's per-character rate, on every run. The
              # manifest is committed precisely so this check still works.
              mf = dd + "/manifest.json"
              if not os.path.exists(mf):
                  todo.append(slug); continue
              have = {v["audio"].rsplit("/", 1)[-1] for v in json.load(open(mf)).values()}
              if any(f"{h(dv[p['thinker']], strip(p['text']))}.mp3" not in have for p in d["posts"]):
                  todo.append(slug)
          print("to bake:", todo or "(none)")
          for slug in todo:
              r = subprocess.run(["python3", "bake-debate.py", slug])
              if r.returncode != 0: print("FAILED", slug)
          PY
      - name: Commit audio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the manifests: the MP3s themselves are in R2, and .gitignore
          # keeps them out even if a fallback bake wrote some locally.
          git add audio/debate/*/manifest.json || true
          git diff --cached --quiet || git commit -m "Auto-bake debate audio [skip bake]"
          git push || true
