<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>议题投票 · 思想家圆桌辩论</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Noto Serif SC", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0a0e1a 100%);
      color: #d8dbe2; min-height: 100vh; line-height: 1.7; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 52px 22px 90px; position: relative; }
    .lang-toggle { position: absolute; top: 16px; right: 18px; background: rgba(255,255,255,0.06);
      color: #cdd2dd; border: 1px solid rgba(123,97,255,0.4); border-radius: 8px; padding: 5px 13px;
      font-size: 12px; font-weight: 700; letter-spacing: .5px; cursor: pointer; font-family: inherit; transition: all .15s; }
    .lang-toggle:hover { color: #fff; background: rgba(123,97,255,0.35); border-color: #7b61ff; }
    .crumb { font-size: 0.78rem; color: #7b61ff; font-family: "SF Mono", Menlo, monospace; letter-spacing: 1px; margin-bottom: 14px; text-align: center; }
    .crumb a { color: #7b61ff; text-decoration: none; }
    .crumb a:hover { color: #00d4ff; }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1px; text-align: center; margin-bottom: 8px;
      background: linear-gradient(135deg, #a29bfe, #7b61ff 50%, #ff6ec4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .sub { text-align: center; color: #9aa3bd; font-size: 0.95rem; font-weight: 300; margin-bottom: 8px; }
    .howto { text-align: center; color: #8089a0; font-size: 0.82rem; margin: 0 auto 26px; max-width: 600px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(123,97,255,0.2); border-radius: 10px; padding: 10px 16px; }
    .sec-label { font-size: 0.78rem; color: #7b61ff; letter-spacing: 2px; text-transform: uppercase; font-family: "SF Mono", Menlo, monospace; opacity: 0.8; margin: 30px 0 10px; }
    .cat-head { display: flex; align-items: center; gap: 9px; margin: 22px 0 11px; padding-left: 2px; }
    .cat-head .cat-name { font-size: 0.98rem; font-weight: 700; color: #cdbff5; }
    .cat-head .cat-count { font-size: 0.7rem; font-weight: 700; color: #9aa3bd; background: rgba(123,97,255,0.14); border-radius: 10px; padding: 1px 8px; font-family: "SF Mono", Menlo, monospace; }
    .cat-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(123,97,255,0.25), transparent); }

    .topic-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; transition: border-color .15s; }
    .topic-card:hover { border-color: rgba(123,97,255,0.4); }
    .tc-head { display: flex; align-items: flex-start; gap: 14px; }
    .rank { flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px; background: rgba(123,97,255,0.15); color: #b7a8f0;
      font-family: "SF Mono", Menlo, monospace; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
    .rank.top { background: linear-gradient(135deg, #ffd166, #e8743b); color: #2a1605; }
    .tc-body { flex: 1; min-width: 0; }
    .tc-q { font-size: 1.06rem; font-weight: 700; color: #fff; line-height: 1.45; }
    .tc-note { font-size: 0.85rem; color: #9aa3bd; margin-top: 4px; }
    .tc-actions { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .vote-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(123,97,255,0.14); border: 1px solid rgba(123,97,255,0.35);
      color: #cdbff5; border-radius: 18px; padding: 5px 14px; font-size: 0.86rem; cursor: pointer; font-family: inherit; transition: all .15s; }
    .vote-pill:hover { background: rgba(123,97,255,0.28); color: #fff; }
    .vote-pill .cnt { font-weight: 700; font-family: "SF Mono", Menlo, monospace; }
    .vote-pill.open { background: rgba(123,97,255,0.3); color: #fff; border-color: #7b61ff; }
    .badge-top { font-size: 0.72rem; color: #ffce6b; border: 1px solid rgba(255,209,102,0.4); border-radius: 12px; padding: 2px 9px; }

    /* vote control (👍 net 👎) */
    .vote-ctl { display: inline-flex; align-items: center; gap: 4px; background: rgba(123,97,255,0.1); border: 1px solid rgba(123,97,255,0.3); border-radius: 18px; padding: 3px 6px; }
    .vote-ctl .vbtn { background: none; border: none; color: #9aa3bd; cursor: pointer; font-size: 1rem; line-height: 1; padding: 3px 6px; border-radius: 12px; transition: all .12s; display: inline-flex; }
    .vote-ctl .vbtn:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .vote-ctl .vbtn.up.on { color: #7fcf9a; }
    .vote-ctl .vbtn.down.on { color: #ff6ec4; }
    .vote-ctl .net { min-width: 22px; text-align: center; font-weight: 700; font-family: "SF Mono", Menlo, monospace; font-size: 0.9rem; color: #cdbff5; }
    .discuss-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
      color: #b3bace; border-radius: 18px; padding: 5px 14px; font-size: 0.86rem; cursor: pointer; font-family: inherit; transition: all .15s; }
    .discuss-pill:hover { background: rgba(123,97,255,0.22); color: #fff; }
    .discuss-pill.active { background: rgba(123,97,255,0.3); color: #fff; border-color: #7b61ff; }

    /* comment thread */
    .thread-wrap { display: none; margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.1); }
    .thread-wrap.show { display: block; }
    .th-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
    .th-empty { font-size: 0.82rem; color: #8089a0; padding: 4px 2px; }
    .th-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 13px; }
    .th-meta { font-size: 0.75rem; color: #8089a0; margin-bottom: 4px; }
    .th-meta b { color: #cdd2dd; font-weight: 700; }
    .th-text { font-size: 0.9rem; color: #d8dbe2; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .th-form .th-name { width: 100%; max-width: 240px; padding: 8px 11px; margin-bottom: 8px; border-radius: 8px; font-size: 0.85rem; font-family: inherit; color: #e4e6eb; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.14); }
    .th-form .th-body { display: block; width: 100%; min-height: 70px; padding: 9px 12px; border-radius: 8px; font-size: 0.88rem; font-family: inherit; color: #e4e6eb; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.14); resize: vertical; }
    .th-form .th-name:focus, .th-form .th-body:focus { outline: none; border-color: #7b61ff; }
    .th-form .th-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .th-row { display: flex; align-items: center; gap: 12px; margin-top: 9px; }
    .th-send { padding: 8px 20px; border: none; border-radius: 8px; background: linear-gradient(135deg,#7b61ff,#00d4ff); color: #fff; font-weight: 700; font-size: 0.86rem; cursor: pointer; font-family: inherit; transition: opacity .15s; }
    .th-send:hover { opacity: 0.88; }
    .th-send:disabled { opacity: 0.5; cursor: default; }
    .th-msg { font-size: 0.82rem; min-height: 16px; color: #7fcf9a; }
    .th-msg.err { color: #ff6ec4; }

    .done-card { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;
      background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; transition: all .15s; }
    .done-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(123,97,255,0.4); transform: translateX(3px); }
    .done-card .dq { flex: 1; min-width: 0; font-size: 0.92rem; color: #cdd2dd; }
    .done-card .dgo { font-size: 0.8rem; color: #a29bfe; font-weight: 600; flex-shrink: 0; }
    .done-card .dcheck { color: #7fcf9a; flex-shrink: 0; }
    .done-sub { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: #7fcf9a; letter-spacing: 1px; opacity: .8; margin: 12px 0 8px 2px; }
    footer { text-align: center; margin-top: 44px; font-size: 0.78rem; color: #5a6378; }
    footer a { color: #7b61ff; text-decoration: none; }
    @media (max-width: 600px) { h1 { font-size: 1.6rem; } .wrap { padding: 34px 14px 70px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="lang-toggle" class="lang-toggle">EN</button>
    <div class="crumb"><a href="/index.zh.html">← Learning Hub</a> &nbsp;/&nbsp; <a href="index.html">Thinking Hub</a> &nbsp;/&nbsp; <span id="crumb-tail">议题投票</span></div>
    <h1 id="h1">议题投票</h1>
    <div class="sub" id="sub">想看哪场辩论？给议题点赞，票最高的下一场就开。</div>
    <div class="howto" id="howto"></div>
    <div id="content"></div>
    <footer>BigCat · Thinking Hub · <a href="https://github.com/cissy0802">GitHub</a></footer>
  </div>
  <script src="ideas.js"></script>
  <script src="/search.js" defer></script>
<script src="/index-button.js" defer></script>
</body>
</html>
