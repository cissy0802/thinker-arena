<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>思想家圆桌辩论</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="服务器">
      <a class="server" href="index.html" title="返回议题列表"><i class="ti ti-building-bank"></i></a>
      <div class="divider"></div>
    </nav>
    <main class="main">
      <header class="chan-header">
        <a href="index.html" class="back" title="全部议题"><i class="ti ti-chevron-left"></i><span>全部议题</span></a>
        <i class="ti ti-hash hash"></i>
        <span class="title" id="chan-title">圆桌辩论</span>
        <span class="sep"></span>
        <span class="sub" id="chan-sub"></span>
        <span class="members"><i class="ti ti-users" style="font-size:16px"></i> <span id="member-count"></span></span>
      </header>
      <div class="scroll">
        <div class="thread" id="thread"></div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
  <script src="/search.js" defer></script>
<script src="/index-button.js" defer></script>
</body>
</html>
