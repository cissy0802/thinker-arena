name: Bake Debate Audio

on:
  push:
    branches: [main]
    paths:
      - "debates/*.json"
      - "bake-debate.py"
      - "voices.json"
  workflow_dispatch:
    inputs:
      slug:
        description: "Debate slug (blank = all)"
        required: false
        default: ""

concurrency:
  group: bake-debates
  cancel-in-progress: false

jobs:
  bake:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip bake]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Bake changed (or all) debates
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            python3 bake-debate.py "${{ inputs.slug }}"
          else
            # only debates whose json changed in this push (fallback: none)
            changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'debates/*.json' 2>/dev/null | sed 's#debates/##;s#\.json##' || true)
            for slug in $changed; do
              [ "$slug" = "index" ] && continue
              python3 bake-debate.py "$slug" || echo "FAILED $slug"
            done
          fi
      - name: Commit audio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/debate/ || true
          git diff --cached --quiet || git commit -m "Auto-bake debate audio [skip bake]"
          git push || true
