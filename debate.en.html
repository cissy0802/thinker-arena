<!DOCTYPE html>
<html lang="en" data-no-hub-nav>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thinkers' Round Table</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Servers">
      <a class="server" href="index.en.html" title="Back to all debates"><i class="ti ti-building-bank"></i></a>
      <div class="divider"></div>
    </nav>
    <main class="main">
      <header class="chan-header">
        <a href="index.en.html" class="back" title="All debates"><i class="ti ti-chevron-left"></i><span>All debates</span></a>
        <i class="ti ti-hash hash"></i>
        <span class="title" id="chan-title">Round Table</span>
        <span class="sep"></span>
        <span class="sub" id="chan-sub"></span>
        <span class="members"><i class="ti ti-users" style="font-size:16px"></i> <span id="member-count"></span></span>
      </header>
      <div class="scroll">
        <div class="thread" id="thread"></div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
  <script src="/search.js" defer></script>
  <script src="/index-button.js" defer></script>
</body>
</html>
