name: Refresh votes + audience inbox

# 从自建投票后端(Cloudflare Worker + D1)拉两样东西：
#   1) 每个候选的净票 → 回写 ideas.json 的 candidates[].votes（供 routine 按「票王」选题）
#   2) 观众评论/提案 → 快照到 audience_inbox.json（供 routine 收观众提案，见 ENGINE §4③）
#
# 为什么用 GitHub Action：云端 routine 的 container 走 agent 出口代理，够不到
# bigcat-engage.cissychen.workers.dev(403)，refresh_votes.py / refresh_inbox.py 在那里
# 永远拉不到数据。而 GitHub 托管 runner 不在那堵墙后面，能直连公开后端——所以把「拉后端」
# 放这里，让 ideas.json / audience_inbox.json 始终带着最新数据，routine 只管读文件即可。

on:
  schedule:
    - cron: '17 */12 * * *'   # 每 12 小时(UTC 00:17 / 12:17)
  workflow_dispatch:           # 也可在 Actions 页手动触发

permissions:
  contents: write

concurrency:
  group: refresh-engage
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull net votes into ideas.json
        run: python3 refresh_votes.py

      - name: Pull audience comments into audience_inbox.json
        run: python3 refresh_inbox.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas.json audience_inbox.json
          if git diff --cached --quiet; then
            echo "votes & inbox unchanged."
            exit 0
          fi
          git commit -m "Auto-refresh votes + audience inbox from backend"
          git push
