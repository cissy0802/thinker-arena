<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人物图鉴 · 思想家圆桌辩论</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Noto Serif SC", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0a0e1a 100%);
      color: #d8dbe2; min-height: 100vh; line-height: 1.75; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 52px 22px 90px; position: relative; }
    .lang-toggle { position: absolute; top: 16px; right: 18px; background: rgba(255,255,255,0.06);
      color: #cdd2dd; border: 1px solid rgba(123,97,255,0.4); border-radius: 8px; padding: 5px 13px;
      font-size: 12px; font-weight: 700; letter-spacing: .5px; cursor: pointer; font-family: inherit; transition: all .15s; }
    .lang-toggle:hover { color: #fff; background: rgba(123,97,255,0.35); border-color: #7b61ff; }
    .crumb { font-size: 0.78rem; color: #7b61ff; font-family: "SF Mono", Menlo, monospace; letter-spacing: 1px; margin-bottom: 14px; text-align: center; }
    .crumb a { color: #7b61ff; text-decoration: none; }
    .crumb a:hover { color: #00d4ff; }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1px; text-align: center; margin-bottom: 8px;
      background: linear-gradient(135deg, #a29bfe, #7b61ff 50%, #ff6ec4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .sub { text-align: center; color: #9aa3bd; font-size: 0.95rem; font-weight: 300; margin-bottom: 28px; }
    .index { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-bottom: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; color: #d8dbe2;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 3px 11px 3px 3px; transition: all .15s; }
    .chip:hover { background: rgba(255,255,255,0.09); transform: translateY(-1px); }
    .chip .av { width: 22px; height: 22px; font-size: 11px; }
    .chip .nm { font-size: 13px; }
    .av { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 500; flex-shrink: 0; }

    .card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
      padding: 22px 24px; margin-top: 26px; scroll-margin-top: 18px; }
    .card .head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
    .card .head .av { width: 52px; height: 52px; font-size: 22px; }
    .card .head .nm { font-size: 1.35rem; font-weight: 700; color: #fff; }
    .card .head .nm-en { font-size: 0.92rem; color: #b9c0d0; margin-top: 1px; }
    .card .head .handle { font-size: 0.8rem; color: #8b93ad; font-family: "SF Mono", Menlo, monospace; }
    .card .head .meta { font-size: 0.82rem; color: #9aa3bd; margin-top: 2px; }
    .card .reason { font-size: 0.86rem; color: #b7a8f0; background: rgba(123,97,255,0.12); border-radius: 8px; padding: 8px 12px; margin: 12px 0 4px; }
    .sec { margin-top: 16px; }
    .sec .lbl { font-size: 0.78rem; font-weight: 500; color: #7b9fd8; letter-spacing: 0.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .sec p { font-size: 0.95rem; color: #cdd2dd; }
    .sec p + p { margin-top: 10px; }
    .sec ul { list-style: none; }
    .sec li { font-size: 0.93rem; color: #cdd2dd; padding: 4px 0 4px 16px; position: relative; }
    .sec li::before { content: "—"; position: absolute; left: 0; color: #6a7290; }
    .assess { border-left: 2px solid rgba(123,97,255,0.5); padding: 2px 0 2px 12px; margin: 8px 0; }
    .assess .by { font-size: 0.82rem; color: #a29bfe; font-weight: 500; }
    .assess .txt { font-size: 0.92rem; color: #cdd2dd; }
    .quote { font-style: italic; color: #e6e2cf; font-family: "Noto Serif SC", Georgia, serif; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 12px; color: #b7a8f0; background: rgba(123,97,255,0.12); border-radius: 12px; padding: 2px 10px; }
    .todo { font-size: 0.85rem; color: #7a8199; font-style: italic; margin-top: 10px; }
    .toplink { display: block; text-align: center; margin-top: 16px; font-size: 0.8rem; color: #7b61ff; text-decoration: none; }
    .toplink:hover { color: #00d4ff; }
    .cat-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 8px; }
    .cat-card { display: block; text-decoration: none; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 15px 18px; transition: all .15s; }
    .cat-card:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); border-color: rgba(123,97,255,0.45); }
    .cat-card .cname { font-size: 1.02rem; font-weight: 700; color: #fff; }
    .cat-card .ccount { font-size: 0.76rem; color: #9aa3bd; margin-left: 6px; font-weight: 400; }
    .cat-card .cavs { display: flex; margin-top: 10px; }
    .cat-card .cavs .av { width: 26px; height: 26px; font-size: 12px; margin-right: -7px; border: 2px solid #161b2e; }
    .cat-nav { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin: 6px 0 10px; }
    .cat-nav a { font-size: 12px; text-decoration: none; color: #9aa3bd; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 3px 11px; transition: all .15s; }
    .cat-nav a.cur { color: #fff; background: rgba(123,97,255,0.25); border-color: rgba(123,97,255,0.5); }
    .cat-nav a:hover { color: #fff; }
    .back-link { display: inline-flex; align-items: center; gap: 5px; font-size: 0.82rem; color: #7b61ff; text-decoration: none; }
    .back-link:hover { color: #00d4ff; }
    .cat-title { font-size: 1.4rem; font-weight: 700; color: #fff; margin: 10px 0 4px; }
    footer { text-align: center; margin-top: 44px; font-size: 0.78rem; color: #5a6378; }
    footer a { color: #7b61ff; text-decoration: none; }
    @media (max-width: 600px) { h1 { font-size: 1.6rem; } .wrap { padding: 34px 14px 70px; } .card { padding: 18px 16px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="lang-toggle" class="lang-toggle">EN</button>
    <div class="crumb"><a href="https://cissy0802.github.io/">← Learning Hub</a> &nbsp;/&nbsp; <a href="index.html">Thinking Hub</a> &nbsp;/&nbsp; <span id="crumb-tail">人物图鉴</span></div>
    <h1 id="h1">人物图鉴</h1>
    <div class="sub" id="sub">圆桌上每一位思想家，深入认识一下</div>
    <div id="content"></div>
    <footer>BigCat · Thinking Hub · <a href="https://github.com/cissy0802">GitHub</a></footer>
  </div>
  <script src="profiles.js"></script>
  <script src="/search.js" defer></script>
</body>
</html>
